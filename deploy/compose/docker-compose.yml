services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  deploy-webhook:
    image: adnanh/webhook:2.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    command:
      - "-verbose"
      - "-hotreload"
      - "-hooks=/etc/webhook/hooks.json"
      - "-port=9000"
    volumes:
      - /opt/myapp/hooks/hooks.json:/etc/webhook/hooks.json:ro
      - /opt/myapp/bin:/opt/myapp/bin:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/myapp:/opt/myapp
