services:
  codex-ws-client:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_SERVER_URL: "https://developers.openai.com/codex/app-server"
      OAUTH_AUTHORIZE_URL: "${OAUTH_AUTHORIZE_URL}"
      OAUTH_TOKEN_URL: "${OAUTH_TOKEN_URL}"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID}"
      OAUTH_SCOPES: "${OAUTH_SCOPES:-openid profile}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      STATE_TTL_SECONDS: "600"
    volumes:
      - codex_ws_client_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  codex_ws_client_data:
