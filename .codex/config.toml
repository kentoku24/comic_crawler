[features]
multi_agent = true

[agents]
max_threads = 40
max_depth = 5

[agents.explorer]
description = "Read-only explorer for mapping the smallest relevant code path before implementation."
config_file = "agents/explorer.toml"

[agents."gh-pr-reviewer"]
description = "Read-only PR reviewer role for approval gates and implementation risks."
config_file = "agents/gh-pr-reviewer.toml"

[agents.maker]
description = "Implementation-focused worker for the smallest bounded issue packet."
config_file = "agents/maker.toml"
