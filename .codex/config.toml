[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only explorer for mapping the smallest relevant code path before implementation."
config_file = "agents/explorer.toml"

[agents.chief_engineer]
description = "Read-only technical authority for constraints, risks, and safer alternatives."
config_file = "agents/chief-engineer.toml"

[agents.maker]
description = "Implementation-focused worker for the smallest bounded issue packet."
config_file = "agents/maker.toml"

[agents.telemetry]
description = "Read-only validator for tests, evidence, and residual risk."
config_file = "agents/telemetry.toml"
