services:
  gemini-novnc:
    build: .
    container_name: gemini-novnc
    ports:
      # x11vnc runs with -nopw (no password); never expose beyond localhost.
      - "127.0.0.1:6080:6080"   # noVNC in browser
      - "127.0.0.1:5900:5900"   # raw VNC (optional)
    volumes:
      - chrome-profile:/data/chrome
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  chrome-profile:
