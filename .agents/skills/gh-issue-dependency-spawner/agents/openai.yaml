interface:
  display_name: "Parent Issue Orchestrator"
  short_description: "Drive a parent issue until every tracked child issue reaches done."
  default_prompt: "Use $gh-issue-dependency-spawner on this parent issue. Track the start-time child issue snapshot, reconcile GitHub dependency and PR state, spawn or resume ready child issues via $gh-issue-maker-chief-engineer-loop in separate worktrees, and do not finish until every tracked child issue is merged, closed, and done."
